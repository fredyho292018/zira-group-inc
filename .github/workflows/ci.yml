name: Zira CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: zira-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: web
      - run: npm run check && npm test && npm run build && npm run validate:infra
        working-directory: web
      - name: Validate shell scripts
        run: bash -n infra/deploy.sh infra/rollback.sh && shellcheck infra/deploy.sh infra/rollback.sh
      - name: Validate Compose
        env:
          ZIRA_IMAGE: ghcr.io/fredyho292018/zira-group-inc:${{ github.sha }}
        run: docker compose -f infra/compose.yaml config --quiet
      - name: Build and smoke test Docker
        run: |
          docker build -f infra/Dockerfile -t zira-ci:${{ github.sha }} .
          ZIRA_IMAGE=zira-ci:${{ github.sha }} docker compose -f infra/compose.yaml up -d --wait --wait-timeout 90
          curl --fail --silent --show-error http://127.0.0.1:38081/health.txt | grep -qx zira-ok
          curl --fail --silent --show-error http://127.0.0.1:38081/ | grep -q 'Building Your Vision'
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: ghcr.io/fredyho292018/zira-group-inc:${{ github.sha }}
